
<html>
<body>

<h3>BMI Calculator</h3>

Weight: <input id="weight"><br>
Height: <input id="height"><br><br>

<button onclick="calculate()">Get BMI</button>

<p>BMI: <span id="score"></span></p>
<p>Type: <span id="type"></span></p>

<script>

function calculate() {

    var w = parseFloat(document.getElementById("weight").value);
    var h = parseFloat(document.getElementById("height").value);

    var bmi = w / (h * h);

    document.getElementById("score").innerHTML = bmi.toFixed(2);

    if (bmi < 18)
        document.getElementById("type").innerHTML = "Underweight";

    else if (bmi <= 25)
        document.getElementById("type").innerHTML = "Normal";

    else if (bmi <= 30)
        document.getElementById("type").innerHTML = "Overweight";

    else
        document.getElementById("type").innerHTML = "Obese";

}

</script>

</body>
</html>
